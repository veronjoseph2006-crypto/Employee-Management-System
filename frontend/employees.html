<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="employee-container">

        <h1>Employee Management</h1>

        <button class="add-btn">Add Employee</button>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>EMP001</td>
                    <td>John Doe</td>
                    <td>IT</td>
                    <td>Developer</td>
                    <td>
                        <button>Edit</button>
                        <button>Delete</button>
                    </td>
                </tr>

                <tr>
                    <td>EMP002</td>
                    <td>Jane Smith</td>
                    <td>HR</td>
                    <td>Manager</td>
                    <td>
                        <button>Edit</button>
                        <button>Delete</button>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</body>
</html>
