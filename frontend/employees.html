<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="employee-container">

        <h1>Employee Management</h1>

        <a href="add-employee.html">
            <button class="add-btn">Add Employee</button>
        </a>
        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>EMP001</td>
                    <td>John Doe</td>
                    <td>IT</td>
                    <td>Developer</td>
                    <td>
                        <a href="edit-employee.html">
                            <button>Edit</button>
                        </a>
                        <button onclick="confirmDelete()">Delete</button>
                    </td>
                </tr>

                <tr>
                    <td>EMP002</td>
                    <td>Jane Smith</td>
                    <td>HR</td>
                    <td>Manager</td>
                    <td>
                        <a href="edit-employee.html">
                            <button>Edit</button>
                        </a>
                        <button onclick="confirmDelete()">Delete</button>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <script>
        function confirmDelete() {
            const result = confirm("Are you sure you want to delete this employee?");

            if (result) {
                alert("Employee Deleted Successfully");
            }
        }
    </script>

</body>

</html>
