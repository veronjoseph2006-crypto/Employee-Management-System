<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <script>
        if (sessionStorage.getItem("loggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>


    <div class="dashboard-container">

        <div class="sidebar">
            <h2>EMS</h2>

            <ul>
                <li>
                    <a href="dashboard.html">Dashboard</a>
                </li>

                <li>
                    <a href="employees.html">Employees</a>
                </li>

                <li>
                    <a href="departments.html">Departments</a>
                </li>

                <li>
                    <a href="#" onclick="logout()">Logout</a>
                </li>
            </ul>
        </div>

        <div class="main-content">

            <div class="header">
                <h1>Dashboard</h1>
            </div>

            <div class="cards">
                <div class="card">
                    <h3>Total Employees</h3>
                    <p id="totalEmployees">0</p>
                </div>

                <div class="card">
                    <h3>Departments</h3>
                    <p id="departments">0</p>
                </div>

                <div class="card">
                    <h3>Highest Salary</h3>
                    <p id="highestSalary">0</p>
                </div>

            </div>

        </div>

    </div>
    <script>
        async function loadDashboard() {

            const response = await fetch("http://localhost:3000/employees");
            const employees = await response.json();
            const departments = [
                ...new Set(employees.map(emp => emp.department))
            ];

            document.getElementById("departments").textContent =
                departments.length;

            const highestSalary = Math.max(
                ...employees.map(emp => Number(emp.salary))
            );

            document.getElementById("highestSalary").textContent =
                highestSalary;

            document.getElementById("totalEmployees").textContent =
                employees.length;
        }

        loadDashboard();
    </script>
    <script>
        function logout() {
            sessionStorage.removeItem("loggedIn");
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
