<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="form-container">

        <h1>Add Employee</h1>

        <form id="addEmployeeForm">

            <label>Employee ID</label>
            <input id="employeeId" type="text" placeholder="Enter Employee ID">

            <label>Employee Name</label>
            <input id="employeeName" type="text" placeholder="Enter Employee Name">

            <label>Email</label>
            <input id="email" type="email" placeholder="Enter Email">

            <label>Phone Number</label>
            <input id="phone" type="tel" placeholder="Enter Phone Number">

            <label>Department</label>
            <input id="department" type="text" placeholder="Enter Department">

            <label>Position</label>
            <input id="position" type="text" placeholder="Enter Position">

            <label>Salary</label>
            <input id="salary" type="number" placeholder="Enter Salary">

            <button type="submit">Add Employee</button>

        </form>

    </div>
    <script src="js/script.js"></script>

</body>

</html>
