<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <script>
        if (sessionStorage.getItem("loggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <div class="form-container">

        <h1>Add Employee</h1>

        <form id="addEmployeeForm" autocomplete="off">

            <label>Employee ID</label>
            <input id="employeeId" type="text" placeholder="Enter Employee ID" required>

            <label>Employee Name</label>
            <input id="employeeName" type="text" placeholder="Enter Employee Name" required>

            <label>Email</label>
            <input id="email" type="email" placeholder="Enter Email" required>

            <label>Phone Number</label>
            <input id="phone" type="tel" placeholder="Enter Phone Number" required>

            <label>Department</label>
            <input id="department" type="text" placeholder="Enter Department" required>

            <label>Position</label>
            <input id="position" type="text" placeholder="Enter Position" required>

            <label>Salary</label>
            <input id="salary" type="number" placeholder="Enter Salary" required>

            <button type="submit">Add Employee</button>

        </form>

    </div>
    <script src="js/script.js"></script>

</body>

</html>
